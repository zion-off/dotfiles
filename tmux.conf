set -g mouse on
set -s set-clipboard on
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Leader = Ctrl-s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Pane navigation with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# New windows inherit the current pane's working directory
bind c new-window -c "#{pane_current_path}"

# Statusline — bubbles theme matching nvim/lualine
# normal_mode_bg #2ecc71 | insert_mode_bg #4a90e2 | secondary_bg #303030 | inactive_bg #080808 | fg #c6c6c6
set -g status-interval 5
set -g status-style "bg=#080808,fg=#c6c6c6"

set -g status-left-length 40
set -g status-left "#[bg=#2ecc71,fg=#080808,bold] #S #[bg=#080808,fg=#2ecc71]"

set -g status-right-length 120
set -g status-right "#[fg=#c6c6c6,bg=#080808] #{=/40/...:pane_title} #[bg=#303030,fg=#c6c6c6] #(~/.local/bin/tmux-stats) #[bg=#4a90e2,fg=#080808,bold] %H:%M %d-%b-%y "

set -g window-status-format "#[fg=#c6c6c6] #I:#W#{?window_flags,#{window_flags}, } "
set -g window-status-current-format "#[fg=#080808,bg=#2ecc71]#[fg=#080808,bg=#2ecc71,bold] #I:#W#{?window_flags,#{window_flags}, }#[fg=#2ecc71,bg=#080808,nobold]"
set -g window-status-separator ""

set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#2ecc71"

# Messages / confirm prompts (leader x, etc.) — visual_mode_bg from lualine
set -g message-style "bg=#f5d142,fg=#080808,bold"
set -g message-command-style "bg=#f5d142,fg=#080808,bold"
